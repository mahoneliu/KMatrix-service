# Docker 环境专用配置示例，请根据实际情况修改
# 这里的配置会覆盖 application.yml 中的同名配置

spring:
  datasource:
    dynamic:
      datasource:
        master:
          # Docker容器内部访问，使用 localhost 连接容器自带的 PostgreSQL
          url: jdbc:postgresql://localhost:5432/kmatrix?currentSchema=public&reWriteBatchedInserts=true
          username: root
          password: kmatrix#321
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

# AI 模块配置
ai:
  file-store:
    # 容器内的文件上传路径
    local-path: /data/uploads
  # 是否开启全系统统一向量模型。true:全系统强制使用一个默认向量模型；false:允许每个知识库使用不同向量模型
  unified-embedding-model: true
  reranker:
    # 容器内的模型路径
    model-path: /opt/models/model.onnx
    tokenizer-path: /opt/models/tokenizer.json

logging:
  level:
    dev.langchain4j: INFO
    org.dromara.ai: INFO