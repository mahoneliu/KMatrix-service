# Docker 环境专用配置
# 这里的配置会覆盖 application-dev.yml 中的同名配置

spring:
  datasource:
    dynamic:
      datasource:
        master:
          # Docker容器内部访问，使用 localhost 连接容器自带的 PostgreSQL
          url: jdbc:postgresql://localhost:5432/kmatrix?currentSchema=public&reWriteBatchedInserts=true
          username: root
          password: kmatrix#321

# AI 模块配置
ai:
  file-store:
    # 容器内的文件上传路径
    local-path: /data/uploads
  # 是否开启全系统统一向量模型。true:全系统强制使用一个默认向量模型；false:允许每个知识库使用不同向量模型
  unified-embedding-model: true
  reranker:
    # 容器内的模型路径
    model-path: /opt/models/model.onnx
    tokenizer-path: /opt/models/tokenizer.json
  # 知识库分块配置
  km:
    chunking:
      # 子块大小（字符数），默认 200。可被数据集级别配置覆盖
      child-chunk-size: 200
      # 子块重叠大小（字符数），默认 20。可被数据集级别配置覆盖
      child-chunk-overlap: 20

# Redis 配置 (虽然 dev 也是 localhost，但在 docker profile 里显式配置更安全)
spring.data:
  redis:
    host: localhost
    port: 6379
    password: 123456

logging:
  level:
    dev.langchain4j: INFO
    org.dromara.ai: INFO

snail-job:
  enabled: false

spring.boot.admin.client:
  enabled: false