worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    server {
        listen 80;
        server_name localhost;

        # Frontend - Admin
        location / {
            root /usr/share/nginx/html/admin;
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        # Frontend - Chat
        location /chat/ {
            alias /usr/share/nginx/html/chat/;
            try_files $uri $uri/ /chat/index.html;
            index index.html;
        }

        # Backend API Proxy
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:8090/;
        }

        # AI 统一文件存储静态资源代理（本地存储模式）
        location /ai/storage/file/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:8090/ai/storage/file/;
        }
        # Frontend Chat 流式接口
        location /prod-api/ai/chat/stream {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 注意 proxy_pass 结尾没有斜杠，直接映射对应路径
            proxy_pass http://localhost:8090/ai/chat/stream;
            
            # SSE 核心：强制开启 HTTP/1.1
            proxy_http_version 1.1;
            # SSE 核心：清除 Connection 让其支持持久长连接（Keep-Alive）
            proxy_set_header Connection '';
            # SSE 核心：关闭 Nginx 代理缓冲，实现实时流式透传
            proxy_buffering off;
            proxy_cache off;
            # 延长读取超时，避免 AI 生成内容时间过长被 Nginx 断开
            proxy_read_timeout 86400s;
        }
        # Admin Chat 调试专用流式接口
        location /prod-api/ai/admin/chat/stream {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_pass http://localhost:8090/ai/admin/chat/stream;
            
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }
        
        # Backend SSE/WebSocket Proxy (if needed)
        location /prod-api/resource/sse {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://localhost:8090/resource/sse;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
